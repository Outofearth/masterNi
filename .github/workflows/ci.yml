name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支连续推送时，取消仍在排队的旧运行，省机器
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查 + 单元测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        # --ignore-scripts：跳过 husky prepare，CI 环境不需要装 git hooks
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 单元测试（Vitest）
        run: npm test

  build:
    name: 生产构建
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: next build
        run: npm run build

  e2e:
    name: 端到端测试（Playwright）
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 运行 e2e
        run: npx playwright test

      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
